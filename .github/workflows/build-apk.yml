name: Flutter Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --org com.mrobaei --project-name support_foundation_takeoff .
      - name: Set Android launcher label
        run: sed -i 's/android:label="support_foundation_takeoff"/android:label="متره فونداسیون ساپورت‌ها"/' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart code
        run: dart format .
      - name: Static analysis
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: support-foundation-takeoff-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
